# SHJobs
#
# Métiers des joueurs : jobs journaliers, niveaux d'XP et points de métier à dépenser dans la boutique.
# Les messages sont dans messages.yml, les menus dans menus.yml et les objets revendables dans custom_items.yml.
#
# Commandes :
#   /jobs                         Ouvre le menu des métiers (le serveur y ajoute /job).
#   /jobs shop                    Ouvre la boutique des métiers.
#   /shjobs (alias /shjobsadmin, /sja)   Commandes d'administration. Sans aucun droit d'administration, /shjobs se
#                                        comporte comme /jobs. Sous-commandes :
#     reload                                                Recharge config.yml, messages.yml, menus.yml et custom_items.yml.
#                                                           Une erreur de syntaxe annule le rechargement. La base n'est
#                                                           rouverte que si database.* a changé ; le bloc reseau demande un
#                                                           redémarrage ; la rotation du jour et les joueurs ne sont pas touchés.
#     list [jobs|shop]                                      Rotation du jour et temps avant la suivante ; avec jobs ou shop,
#                                                           tous les ids disponibles.
#     exp <give|remove|set> <joueur> <métier> <montant>     Gère l'XP de métier d'un joueur.
#     level set <joueur> <métier> <niveau>                  Définit le niveau de métier d'un joueur.
#     points <give|remove|set> <joueur> <montant>           Gère les points de métier d'un joueur.
#     playerinfo <joueur>                                   Affiche les informations de métier d'un joueur (alias info).
#     job change <slot 1-6> [id_job]                        Change un job journalier.
#     shopitem change <slot 1-6> [id_article]               Change un article de la boutique du jour.
#     resetdaily                                            Force la rotation des jobs et de la boutique.
#     import                                                Reprend les données de ce serveur dans la base partagée (mode réseau).
#     customitem save <id>                                  Enregistre l'objet en main dans custom_items.yml.
#     customitem list                                       Liste les objets enregistrés.
#     customitem give <id> [joueur]                         Donne une copie d'un objet enregistré (joueur obligatoire en console).
#   Tout marche en console sauf customitem save.
#
# Permissions :
#   shjobs.use                     Ouvrir /jobs (accordée à tous par défaut).
#   shjobs.shop                    Ouvrir /jobs shop (op par défaut).
#   shjobs.admin                   Toute l'administration (op par défaut), parent de toutes les permissions suivantes.
#   shjobs.admin.reload            reload.
#   shjobs.admin.list              list.
#   shjobs.admin.exp.give          exp give.
#   shjobs.admin.exp.remove        exp remove.
#   shjobs.admin.exp.set           exp set.
#   shjobs.admin.level.set         level set.
#   shjobs.admin.points.give       points give.
#   shjobs.admin.points.remove     points remove.
#   shjobs.admin.points.set        points set.
#   shjobs.admin.playerinfo        playerinfo.
#   shjobs.admin.job.change        job change.
#   shjobs.admin.shop.changeitem   shopitem change.
#   shjobs.admin.resetdaily        resetdaily.
#   shjobs.admin.import            import.
#   shjobs.admin.customitem        customitem (entrée de la sous-commande).
#   shjobs.admin.customitem.save   customitem save.
#   shjobs.admin.customitem.list   customitem list.
#   shjobs.admin.customitem.give   customitem give.
#
# Placeholders PlaceholderAPI (identifiant shjobs) :
#   %shjobs_time_until_reset%                                   Temps restant avant la rotation quotidienne (ex : 10h 30m 15s).
#   %shjobs_player_points%                                      Points de métier du joueur.
#   %shjobs_player_level_<métier>%                              Niveau du joueur dans un métier (ex : %shjobs_player_level_mineur%).
#   %shjobs_player_exp_<métier>%                                XP totale du joueur dans un métier.
#   %shjobs_player_exp_required_<métier>%                       XP requise pour passer au niveau suivant.
#   %shjobs_player_exp_progress_<métier>%                       XP gagnée dans le niveau en cours, sur l'XP requise.
#   %shjobs_player_exp_bar_<métier>%                            Barre de progression vers le niveau suivant.
#   %shjobs_player_exp_percentage_<métier>%                     Pourcentage de progression vers le niveau suivant.
#   %shjobs_player_rank_<métier>%                               Rang du joueur dans le classement du métier.
#   %shjobs_leaderboard_<métier>_<rang 1-10>_<name|level|exp>%  Joueur d'un rang du classement du métier.
#   %shjobs_player_job_daily_<slot 1-6>_name%                   Nom du job journalier du slot.
#   %shjobs_player_job_daily_<slot 1-6>_progress%               Progression du job journalier du slot.

# --- Database Settings ---
database:
  type: "SQLITE" # Options: SQLITE, MYSQL
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "shjobs_user"
    password: "CHANGE_ME"
    useSSL: false
    # connection_properties: "autoReconnect=true&useUnicode=true&characterEncoding=utf8" # Optional MySQL properties

# --- Réseau (plusieurs serveurs de jeu) ---
# Actif seulement si SHNetwork est installé ; sans lui, rien ne change : stockage de database.type, rotation du jour
# dans shjobs_server_state.yml, limites de la boutique dans daily_limits.yml.
# Avec SHNetwork, tout est partagé entre les serveurs dans la base ci-dessous (database.type est ignoré) :
#   - les joueurs (points, niveaux, quêtes du jour) : lus à la connexion une fois que le serveur quitté a fini de les
#     sauvegarder, écrits au départ ;
#   - la rotation du jour : tirée une seule fois par le serveur meneur, appliquée par tous les autres ;
#   - les limites quotidiennes de la boutique : changer de serveur ne les remet pas à zéro ;
#   - /shjobs exp|level|points sur un joueur connecté ailleurs est exécuté sur son serveur.
# /shjobs import reprend dans la base les joueurs de database/shjobs_data.db et les limites de daily_limits.yml.
# Demande un redémarrage : tout le bloc.
reseau:
  actif: true
  # Canal du bus SHNetwork où la rotation du jour est annoncée aux autres serveurs
  canal: shjobs
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/minecraft"
    utilisateur: shjobs
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion à la base, en millisecondes
    delai-ms: 5000
  # Temps d'attente maximal, en secondes, de la sauvegarde d'un joueur par le serveur qu'il quitte avant de lire ses données
  attente-sauvegarde-secondes: 10
  # Intervalle, en secondes, de relecture de la rotation en base : rattrape un message du bus perdu
  relecture-rotation-secondes: 30

# --- General Settings ---
general:
  daily_reset_time: "00:00" # HH:mm format (24-hour clock) for daily jobs and shop reset. Uses server's local time.
  # Points de métier en bonus quand un joueur termine toutes les quêtes du jour (0 = désactivé).
  all_daily_jobs_bonus_points: 20
  # Limites quotidiennes par joueur et par article de la boutique (0 = illimité), remises à zéro à la rotation.
  # Un article peut les remplacer : purchase_limit_per_day / sell_limit_per_day. Une revente = une unité de l'article.
  default_purchase_limit_per_day: 1
  default_sell_limit_per_day: 2
  # Son joué au gain d'un niveau de métier, avec son message (messages.yml : rewards.level_up).
  # Format : SON[:volume[:hauteur]]
  level_up_sound: ENTITY_PLAYER_LEVELUP

# --- Logs ---
# Lignes écrites dans SHLogs (plugins/SHLogs/SHJobs/), sans date : SHLogs l'ajoute.
# file : nom du fichier de log. format : ligne écrite.
logs:
  # Achat d'un article de la boutique des métiers.
  # Variables : %player%, %amount% (nombre d'articles achetés), %item% (nom de l'article), %price% (points de métier dépensés).
  shop_purchase:
    file: "boutique"
    format: "%player% -> achète %amount%x %item% (%price% points de métier)"
  # Revente d'objets à la boutique des métiers, au clic droit ou en une fois avec Shift + clic droit.
  # Variables : %player%, %amount% (nombre d'objets repris), %item% (nom de l'objet), %price% (points de métier gagnés).
  shop_sale:
    file: "boutique"
    format: "%player% -> revend %amount%x %item% (%price% points de métier)"
  # Niveau de métier gagné en terminant un job, une ligne par niveau gagné.
  # Variables : %player%, %level% (niveau atteint), %job% (nom du métier).
  level_up:
    file: "niveaux"
    format: "%player% -> monte au niveau %level% (%job%)"

# --- Experience & Levels ---
# XP formulas use JavaScript evaluation. %level% is the target level you are trying to reach.
# Example: To reach level 2, %level% will be 2. XP for level 1 is always 0.
experience:
  # Default XP progression if not specified per job
  # default_xp_formula: "1000 + (%level% - 1) * 500" # XP needed to reach %level%
  default_xp_formula: "100" # XP needed to reach %level%
  default_max_level: 100

  jobs:
    bucheron: # Must match a JobType enum key (case-insensitive)
    # xp_formula: "100"
    # max_level: 100
    # Example of fixed XP overrides for specific levels (optional)
    # exp_per_level:
    #   2: 750
    #   3: 1800
    mineur:
    # Uses default
    agriculteur:
    # Uses default
    chasseur:
    # Uses default
    artisan:
    # Uses default
    pecheur:
    # Uses default

