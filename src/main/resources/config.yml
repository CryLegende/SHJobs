# SHJobs Configuration File
# --- Plugin Information ---
#
# == COMMANDS ==
# /jobs - Ouvre le menu principal des métiers.
#   Permission: shjobs.player.menu (default: true)
#
# /shjobsadmin (alias: /sja) - Commandes d'administration.
#   Base Permission: shjobs.admin.base (default: op)
#   Sous-commandes (permissions à implémenter):
#   - reload: Recharge la configuration du plugin. (shjobs.admin.reload)
#   - exp give <player> <job_type> <amount>: Donne de l'XP de métier. (shjobs.admin.exp.give)
#   - exp remove <player> <job_type> <amount>: Retire de l'XP de métier. (shjobs.admin.exp.remove)
#   - level set <player> <job_type> <level>: Définit le niveau de métier. (shjobs.admin.level.set)
#   - points give <player> <amount>: Donne des points de métier. (shjobs.admin.points.give)
#   - points remove <player> <amount>: Retire des points de métier. (shjobs.admin.points.remove)
#   - playerinfo <player>: Affiche les informations de métier d'un joueur. (shjobs.admin.playerinfo)
#   - job change <slot_1-3> [job_template_id]: Change un job journalier. (shjobs.admin.job.change)
#   - shop change <slot_1-6> [shop_item_id]: Change un item de la boutique. (shjobs.admin.shop.changeitem)
#
# == PERMISSIONS ==
# shjobs.player.menu: Accès à /jobs.
# shjobs.admin.base: Accès de base à /shjobsadmin.
# shjobs.admin.reload: Permet d'utiliser /sja reload.
# shjobs.admin.exp.give: Permet de donner de l'XP.
# shjobs.admin.exp.remove: Permet de retirer de l'XP.
# shjobs.admin.level.set: Permet de définir un niveau.
# shjobs.admin.points.give: Permet de donner des points.
# shjobs.admin.points.remove: Permet de retirer des points.
# shjobs.admin.playerinfo: Permet de voir les infos d'un joueur.
# shjobs.admin.job.change: Permet de changer un job journalier.
# shjobs.admin.shop.changeitem: Permet de changer un item de la boutique.
# shjobs.job.<job_type>.bypassrequirements: (Optionnel) Permet de prendre des jobs sans les prérequis.
# shjobs.shop.bypasslevel: (Optionnel) Permet d'acheter des items sans le niveau de métier requis.
#
# == PLACEHOLDERS (PlaceholderAPI) ==
# %shjobs_player_points%: Points de métier du joueur.
# %shjobs_player_level_<job_type>%: Niveau du joueur dans le métier <job_type> (ex: %shjobs_player_level_mineur%).
# %shjobs_player_exp_<job_type>%: XP actuelle du joueur dans le métier <job_type>.
# %shjobs_player_exp_required_<job_type>%: XP requise pour le prochain niveau dans <job_type>.
# %shjobs_player_exp_percentage_<job_type>%: Pourcentage d'XP vers le prochain niveau dans <job_type>.
# %shjobs_player_job_daily_<slot>_name%: Nom du job journalier dans l'emplacement <slot> (1-3).
# %shjobs_player_job_daily_<slot>_progress% : Progression formatée du job journalier <slot>.
# %shjobs_time_until_reset%: Temps restant avant la réinitialisation journalière (ex: 10h 30m 15s).
# ... d'autres placeholders pourront être ajoutés pour les détails des objectifs.

# --- Database Settings ---
database:
  type: "SQLITE" # Options: SQLITE, MYSQL
  mysql:
    host: "localhost"
    port: 3306
    database: "shjobs_db"
    username: "shjobs_user"
    password: "CHANGE_ME"
    useSSL: false
    # connection_properties: "autoReconnect=true&useUnicode=true&characterEncoding=utf8" # Optional MySQL properties

# --- General Settings ---
general:
  daily_reset_time: "00:00" # HH:mm format (24-hour clock) for daily jobs and shop reset. Uses server's local time.

# --- Experience & Levels ---
# XP formulas use JavaScript evaluation. %level% is the target level you are trying to reach.
# Example: To reach level 2, %level% will be 2. XP for level 1 is always 0.
experience:
  # Default XP progression if not specified per job
  # default_xp_formula: "1000 + (%level% - 1) * 500" # XP needed to reach %level%
  default_xp_formula: "100" # XP needed to reach %level%
  default_max_level: 1000

  jobs:
    bucheron: # Must match a JobType enum key (case-insensitive)
    # xp_formula: "100"
    # max_level: 100
    # Example of fixed XP overrides for specific levels (optional)
    # exp_per_level:
    #   2: 750
    #   3: 1800
    mineur:
    # Uses default
    agriculteur:
    # Uses default
    chasseur:
    # Uses default
    artisan:
    # Uses default
    pecheur:
    # Uses default

# --- Job Type Definitions ---
# Used for display names and icons in menus. Keys must match JobType enum.
job_types:
  bucheron:
    display_name: "&6Bûcheron"
    icon: "IRON_AXE"
