name: SHJobs
version: '${project.version}'
main: org.Cry_Legende.sHJobs.SHJobs
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI]

commands:
  jobs:
    description: Opens the main jobs menu.
    usage: /jobs
    aliases: [shjobs]
    permission: shjobs.player.menu
  shjobsadmin:
    description: Admin commands for SHJobs.
    usage: /shjobsadmin <subcommand> [args...]
    aliases: [sja]
    permission: shjobs.admin.base # More specific permissions can be added per subcommand

permissions:
  shjobs.player.menu:
    description: Allows opening the main jobs menu.
    default: true
  shjobs.admin.base:
    description: Base permission for admin commands.
    default: op
