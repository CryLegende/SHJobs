name: SHJobs
version: '${project.version}'
main: org.Cry_Legende.sHJobs.SHJobs
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI]
# SHNetwork est facultatif : sans lui, le plugin tourne seul comme avant.
softdepend: [SHLogs, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (base partagée en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  jobs:
    description: Opens the main jobs menu.
    usage: /jobs
    aliases: [shjobs]
    permission: shjobs.player.menu
  shjobsadmin:
    description: Admin commands for SHJobs.
    usage: /shjobsadmin <subcommand> [args...]
    aliases: [sja]
    permission: shjobs.admin.base # More specific permissions can be added per subcommand

permissions:
  shjobs.player.menu:
    description: Allows opening the main jobs menu.
    default: true
  shjobs.admin.base:
    description: Base permission for admin commands.
    default: op
